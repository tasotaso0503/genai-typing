name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチへの連続 push では古い実行を打ち切る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # lint / typecheck は .nuxt の型定義に依存するため先に生成する
      - name: Prepare Nuxt
        run: npm run postinstall --workspace=apps/frontend

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # 外部 API は全てモックしているので API キーは不要
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
